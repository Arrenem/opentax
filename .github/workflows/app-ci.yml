name: OpenTax App CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentax-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify public source boundary
        run: npm run source:check
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application, lint and types
        run: |
          npm test
          npm run lint
          npm run typecheck
      - name: Build stdio MCP adapter
        run: npm run mcp:build
      - name: Verify checks did not modify tracked source
        run: git diff --exit-code
