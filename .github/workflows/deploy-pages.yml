name: Deploy OpenTax Pages
run-name: Deploy OpenTax Pages from main (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentax-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Arrenem/opentax' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the exact requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Reject a superseded main commit
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote https://github.com/Arrenem/opentax.git refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'main moved; start a new run.'; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked application dependencies without deployment credentials
        run: npm ci --no-audit --no-fund
      - name: Test application, lint and types
        run: |
          npm test
          npm run lint
          npx --no-install tsc --noEmit
      - name: Build production site and test publication boundaries
        run: |
          npm run site:check
          node --test scripts/ci/*.test.mjs
          git diff --exit-code
      - name: Package the checked site and deployment-only tools
        run: node scripts/ci/prepare-site-release.mjs "$RUNNER_TEMP/opentax-release" "$GITHUB_SHA"
      - name: Store the exact checked artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentax-site-${{ github.sha }}
          path: ${{ runner.temp }}/opentax-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    if: github.repository == 'Arrenem/opentax' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # This job has no application checkout, dependency installation or build.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Download only this run's checked artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify artifact identity and content
        working-directory: release
        run: node verify-site-release.mjs --local "$GITHUB_SHA"
      - name: Install the locked deployment tool without Cloudflare credentials
        working-directory: release
        run: |
          npm ci --prefix tools/pages-deploy --ignore-scripts --no-audit --no-fund
          tools/pages-deploy/node_modules/.bin/wrangler --version
      - name: Reject a superseded main commit before deployment
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote https://github.com/Arrenem/opentax.git refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'main moved; start a new run.'; exit 1; }
          node verify-site-release.mjs --local "$GITHUB_SHA"
      - name: Deploy only the checked static site to existing production
        working-directory: release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '3f28ad99b5157218dea0db5a55241e4c'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured.'; exit 1; }
          tools/pages-deploy/node_modules/.bin/wrangler pages deploy site \
            --project-name=opentax --branch=main --commit-hash="$GITHUB_SHA" \
            --commit-message='Publish checked OpenTax site' --commit-dirty=false
      - name: Verify all public pages and assets against the checked build
        working-directory: release
        run: node verify-site-release.mjs --public "$GITHUB_SHA"
