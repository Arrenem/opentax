name: OpenTax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: opentax-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Setup tests use Node built-ins, command/API mocks, a temporary Git repository,
      # and loopback fake tokens only. No gcloud/Firebase CLI or credentials are used.
      - name: Test setup without cloud credentials or dependency installation
        run: npm run setup:test

  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test application and security boundaries
        run: npm test
      - name: Lint and type check
        run: |
          npm run lint
          npx --no-install tsc --noEmit
      - name: Build application and MCP
        run: |
          npm run mcp:build
          npm run backup:build
          npm run build -- --webpack
